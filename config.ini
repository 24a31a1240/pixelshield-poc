# PixelShield Configuration File (Optional)
# Adjust default parameters here instead of command-line flags

# Adversarial Perturbation Parameters
[perturbation]
# Maximum pixel-level change (L∞ norm)
# 8/255 ≈ 0.0314 (recommended baseline, imperceptible)
# 16/255 ≈ 0.0627 (stronger, still mostly imperceptible)
# 32/255 ≈ 0.1255 (very strong, may start to see artifacts)
epsilon = 0.0314

# PGD step size per iteration
# 2/255 ≈ 0.0078 (recommended baseline)
# Larger = faster convergence, smaller = more careful optimization
alpha = 0.0078

# Number of PGD iterations
# 40 (default, good balance)
# 20-30 (faster, weaker effect)
# 100+ (stronger effect, slower)
steps = 40

# Perceptual Loss Threshold
# LPIPS score must stay below this to keep image imperceptible
# 0.01 = imperceptible (very strict)
# 0.05 = barely noticeable (default, allows stronger perturbations)
# 0.10 = noticeably different (not recommended for stealth)
lpips_threshold = 0.05

# Model and Device
[model]
# Device to use: 'cpu' or 'cuda'
# Leave blank for auto-detect
device = auto

# Face embedding model
# Currently: 'facenet' (InceptionResnetV1 pretrained on VGGFace2)
embedding_model = facenet

# Perceptual loss model
# Currently: 'alex' (LPIPS AlexNet backbone)
perceptual_model = alex

# Preprocessing
[preprocessing]
# Target image size for face embedding model
face_size = 160

# Input image format
# Supported: jpg, png, jpeg, bmp
formats = jpg, png, jpeg
